<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Blue to Red Gradient -->
    <linearGradient id="blueRedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="128" fill="#09090B" />

  <!-- Outer Gradient Border Accent -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#blueRedGradient)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Smooth Bold 'S' Glyph with Blue to Red Gradient -->
  <path
    d="M 345 175 C 345 125 305 95 256 95 C 195 95 155 135 155 185 C 155 275 355 255 355 345 C 355 400 305 435 245 435 C 175 435 140 385 135 340"
    fill="none"
    stroke="url(#blueRedGradient)"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />
</svg>